[workspace]
name = "{{ cookiecutter.repo_name }}"
version = "0.1.0"
description = "Reproducible environment for HCI/HCA profile analysis"
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
python = ">=3.10,<3.13"
jupyterlab = ">=4.0"
ipykernel = ">=6.0"
nbformat = ">=5.9"
nbconvert = ">=7.0"

numpy = ">=1.24"
pandas = ">=2.0"
scipy = ">=1.11"
scikit-learn = ">=1.3"
statsmodels = ">=0.14"
umap-learn = ">=0.5"
lightgbm = ">=4.0"
shap = ">=0.44"
hdbscan = ">=0.8.44,<0.9"

matplotlib = ">=3.7"
seaborn = ">=0.12"
plotly = ">=5.20"
adjusttext = ">=1.0"

pyarrow = ">=16"
openpyxl = ">=3"
sqlalchemy = ">=2"
pillow = ">=10.0"
tifffile = ">=2026.7.14,<2027"
joblib = ">=1.3"

marimo = ">=0.23"

tqdm = ">=4"
rich = ">=13"

[pypi-dependencies]
pycytominer = ">=0.3"
copairs = ">=0.5,<0.6"
inmoose = ">=0.9,<1"
harmonypy = ">=2.0.0,<3"
playwright = ">=1.62,<2"

[tasks]
lab = "jupyter lab"
check = "python scripts/check_environment.py"
install-browser = "playwright install chromium"
export-report = "python3 workspace/hca_pipeline/report_export.py"
schema-check = "python3 workspace/hca_pipeline/schema.py"
