[workspace]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "Reproducible environment for HCI/HCA profile analysis"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = "3.11.*"
jupyterlab = "4.*"
ipykernel = "6.*"
nbformat = "5.*"

numpy = "1.26.*"
pandas = "2.2.*"
scipy = "1.13.*"
scikit-learn = "1.5.*"
statsmodels = "0.14.*"
umap-learn = "0.5.*"
lightgbm = "4.*"
shap = "0.46.*"

matplotlib = "3.9.*"
seaborn = "0.13.*"
plotly = "5.*"
adjusttext = "1.*"

pyarrow = "16.*"
openpyxl = "3.*"
sqlalchemy = "2.*"

tqdm = "4.*"
rich = "13.*"

[pypi-dependencies]
pycytominer = ">=1,<2"
copairs = ">=0.5,<0.6"

[tasks]
lab = "jupyter lab"
check = "python scripts/check_environment.py"
